AWSTemplateFormatVersion: '2010-09-09'
Description: Authenticated Nylas Agent Account delivery ingress and pull-only monitor queue.
# Package nylas_receiver.py at the root of a ZIP in the specified S3 object.
# Provision the webhook secret as an existing SSM SecureString out of band after
# GET challenge validation. No secret value appears in stack parameters/outputs.
# Subscribe ONLY message.delivered,message.bounced,message.complaint,message.rejected
# with compressed_delivery=false. This template does not create a Nylas subscription.
Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  NylasApplicationId:
    Type: String
    MinLength: 1
  NylasGrantId:
    Type: String
    MinLength: 1
  WebhookSecretParameter:
    Type: String
    AllowedPattern: '/[A-Za-z0-9_.\-/]+'
    Description: Existing SSM SecureString name; its value is never a template parameter.
  WebhookSecretKmsKeyArn:
    Type: String
    AllowedPattern: 'arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+'
    Description: Customer managed KMS key encrypting the SSM SecureString.
  AlarmTopicArn:
    Type: String
    AllowedPattern: 'arn:aws:sns:[a-z0-9-]+:[0-9]{12}:.+'
    Description: Existing SNS topic with a confirmed operator notification subscription.
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  DeliveryQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5
  DeadLetterRedrivePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              Bool: {'aws:SecureTransport': false}
  DeliveryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref DeliveryQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt DeliveryQueue.Arn
            Condition:
              Bool: {'aws:SecureTransport': false}
  ReceiverRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReceiverOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeliveryQueue.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebhookSecretParameter}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref WebhookSecretKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:PARAMETER_ARN: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebhookSecretParameter}'
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-nylas-receiver:*'
  WorkerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to the Mac mini worker identity; no send or provider API permission.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['sqs:ReceiveMessage', 'sqs:DeleteMessage', 'sqs:GetQueueAttributes']
            Resource: !GetAtt DeliveryQueue.Arn
          - Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource: !GetAtt DeadLetterQueue.Arn
  ReceiverLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-nylas-receiver'
      RetentionInDays: 30
  Receiver:
    Type: AWS::Lambda::Function
    DependsOn: ReceiverLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-nylas-receiver'
      Runtime: python3.13
      Handler: nylas_receiver.handler
      Role: !GetAtt ReceiverRole.Arn
      Timeout: 8
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          WEBHOOK_SECRET_PARAMETER: !Ref WebhookSecretParameter
          DELIVERY_QUEUE_URL: !Ref DeliveryQueue
          NYLAS_APPLICATION_ID: !Ref NylasApplicationId
          NYLAS_GRANT_ID: !Ref NylasGrantId
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-nylas-delivery'
      ProtocolType: HTTP
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Receiver.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 9000
  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /nylas/delivery
      Target: !Sub 'integrations/${Integration}'
  PostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /nylas/delivery
      Target: !Sub 'integrations/${Integration}'
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Receiver
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/nylas/delivery'
  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Delivery monitor has not drained the queue within 10 minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt DeliveryQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Delivery events reached DLQ and need operator inspection.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt DeadLetterQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  ReceiverErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref Receiver}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
Outputs:
  WebhookUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/nylas/delivery'
  DeliveryQueueUrl:
    Value: !Ref DeliveryQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  WorkerPolicyArn:
    Value: !Ref WorkerPolicy
